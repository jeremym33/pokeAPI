openapi: 3.0.3
info:
  title: PokéAPI Ktor
  version: 0.1.0
  description: |
    API Ktor qui s'appuie sur [PokéAPI](https://pokeapi.co/) et met les données en cache dans PostgreSQL.

    Pour commencer : lancez **POST /pokemon/import** (par exemple `limit=151`), puis parcourez **GET /pokemon**.
servers:
  - url: /
tags:
  - name: Comptes
    description: |
      Inscription et connexion. La réponse contient un jeton de session (valable 30 jours) à envoyer dans
      l'en-tête `Authorization: Bearer <jeton>` : bouton « Authorize » de Swagger. L'aventure et les équipes
      sont propres à chaque compte ; le Pokédex et les régions restent publics.
  - name: Aventure
    description: |
      Jeu d'aventure dans Kanto (rencontres de Vert Feuille). Chaque action renvoie l'état complet de la partie (GameView).
      Une route se franchit avec au moins 10 victoires et toutes ses espèces vues (rencontres disponibles dès le départ),
      rencontrées selon leurs chances habituelles.
      Un Pokémon sauvage vaincu peut rejoindre l'équipe selon son taux
      de capture ; les arènes (type et équipe générés d'après les données) donnent des badges qui relèvent le niveau maximum.
  - name: Régions
    description: Lieux des régions et Pokémon qu'on y rencontre
  - name: Pokémon
    description: Consultation et import des Pokémon
  - name: Équipes
    description: Équipes de 6 Pokémon maximum
  - name: Divers

paths:
  /auth/register:
    post:
      tags: [Comptes]
      summary: Créer un compte (et se connecter)
      description: Nom d'utilisateur de 3 à 20 caractères (lettres, chiffres, - et _), unique sans tenir compte de la casse ; mot de passe d'au moins 8 caractères.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Compte créé, session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Nom d'utilisateur déjà pris
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Comptes]
      summary: Se connecter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Comptes]
      summary: Se déconnecter (le jeton est révoqué)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session fermée }

  /auth/me:
    get:
      tags: [Comptes]
      summary: Compte connecté
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /health:
    get:
      tags: [Divers]
      summary: État de l'application et de la base
      responses:
        "200":
          description: Application et base opérationnelles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Base de données indisponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /pokemon:
    get:
      tags: [Pokémon]
      summary: Pokédex — liste paginée, filtrable et triable
      description: |
        Ne renvoie que les Pokémon déjà enregistrés (importés ou consultés), formes régionales comprises
        (Raichu d'Alola…), rangées dans la région de leur forme. Le tri par numéro suit le Pokédex national,
        la forme régionale juste après la forme de base. Les méga-évolutions et autres formes n'y figurent pas.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: type
          in: query
          description: Filtre par type (fire, water, grass…). Deux types séparés par une virgule = le Pokémon doit avoir les deux.
          schema: { type: string }
          example: fire
        - name: region
          in: query
          description: Région d'origine de l'espèce
          schema: { $ref: "#/components/schemas/RegionName" }
        - name: generation
          in: query
          schema: { type: integer, minimum: 1, maximum: 9 }
        - name: name
          in: query
          description: Recherche partielle sur le nom anglais ou français
          schema: { type: string }
          example: sala
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, nameFr, height, weight, baseExperience, statTotal]
            default: id
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Page de résultats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokemonPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /abilities/{name}:
    get:
      tags: [Pokémon]
      summary: Talent détaillé et Pokémon qui le possèdent
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: static
      responses:
        "200":
          description: Le talent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AbilityDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /pokedex/update:
    get:
      tags: [Pokémon]
      summary: État de la mise à jour du Pokédex
      description: À interroger régulièrement pendant la mise à jour pour suivre son avancement.
      responses:
        "200":
          description: État courant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokedexUpdateStatus" }
    post:
      tags: [Pokémon]
      summary: Lance la mise à jour du Pokédex complet en arrière-plan
      description: |
        Traite toutes les espèces du Pokédex national, avec leurs formes régionales.
        `missing` ajoute seulement les Pokémon absents ou incomplets ; `all` récupère à nouveau tous les Pokémon depuis PokéAPI.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [missing, all], default: missing }
      responses:
        "202":
          description: Mise à jour lancée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokedexUpdateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Une mise à jour est déjà en cours (son état est renvoyé)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokedexUpdateStatus" }
    delete:
      tags: [Pokémon]
      summary: Arrête la mise à jour en cours
      responses:
        "202":
          description: Arrêt demandé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokedexUpdateStatus" }
        "404": { $ref: "#/components/responses/NotFound" }

  /game:
    get:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: État de la partie (started = false s'il n'y en a pas)
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Supprime la partie
      responses:
        "204": { description: Partie supprimée }

  /game/new:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Nouvelle partie avec un starter (bulbasaur, charmander ou squirtle)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { starter: { type: string, example: charmander } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/travel:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Se rendre à une étape déjà accessible
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { step: { type: integer, example: 1 } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/heal:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Soigner l'équipe au Centre Pokémon (dans une ville)
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/explore:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Chercher un Pokémon sauvage à l'étape actuelle (lance un combat)
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/gym:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Défier l'arène de la ville actuelle
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/achievements:
    get:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Succès de la partie (seule façon d'obtenir pierres d'évolution et Câble Link)
      description: |
        Objectifs (victoires, badges, Pokémon rejoints ou vus, Pokémon de certains types) avec leur progression.
        Un succès atteint est débloqué à l'action suivante : ses objets vont dans le sac et un message l'annonce.
      responses:
        "200":
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  done: { type: integer }
                  total: { type: integer }
                  achievements:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: type-fire }
                        name: { type: string, example: Dresseur Feu }
                        description: { type: string, example: Faire rejoindre 2 espèces de type Feu. }
                        category: { type: string, example: Types }
                        progress: { type: integer }
                        target: { type: integer }
                        done: { type: boolean }
                        rewards: { type: array, items: { type: string }, example: [Pierre Feu] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Aucune partie en cours }

  /game/dex:
    get:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Motisdex de la partie (Pokémon de Kanto vus et rejoints)
      description: Les 151 espèces de Kanto ; une espèce jamais rencontrée ne révèle ni nom ni image.
      responses:
        "200":
          description: Motisdex
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, example: 151 }
                  seen: { type: integer, description: Espèces vues (rejointes comprises) }
                  caught: { type: integer, description: Espèces qui ont rejoint l'équipe }
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        number: { type: integer, example: 25 }
                        status: { type: string, enum: [UNKNOWN, SEEN, CAUGHT] }
                        name: { type: string, nullable: true, example: Pikachu }
                        types: { type: array, items: { type: string } }
                        spriteUrl: { type: string, nullable: true }
                        artworkUrl: { type: string, nullable: true }
                        owned: { type: integer, description: Nombre dans l'équipe et la boîte }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Aucune partie en cours }

  /game/verify:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Vérifier et corriger les Pokémon de la partie (appelée à l'ouverture de la page)
      description: |
        Contrôle chaque Pokémon de l'équipe et de la boîte d'après les données en base : nom, images, types, statistiques,
        faiblesses, détail des attaques, attaques connues à son niveau, attaques équipées (1 à 4, dont une offensive),
        expérience et PV. Les corrections sont enregistrées et listées dans `corrections`.
      responses:
        "200":
          description: État de la partie, avec la liste des corrections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }

  /game/team:
    put:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Composer l'équipe (1 à 6 Pokémon de l'équipe ou de la boîte, dans l'ordre)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { uids: { type: array, items: { type: string } } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/pokemon/{uid}/moves:
    put:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Choisir les attaques équipées d'un Pokémon (1 à 4, parmi celles qu'il connaît)
      description: Hors combat. Les attaques non équipées restent dans ses attaques connues (knownMoves).
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, example: p1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { moves: { type: array, items: { type: string }, example: [vine-whip, tackle] } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/battle/attack:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Attaquer avec l'attaque n° move du Pokémon actif
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { move: { type: integer, example: 0 } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/battle/switch:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Envoyer un autre Pokémon de l'équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { uid: { type: string, example: p2 } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/battle/flee:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Fuir (combat contre un Pokémon sauvage uniquement)
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/battle/recruit:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Accueillir (accept = true) ou laisser partir le Pokémon vaincu qui veut rejoindre l'équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { accept: { type: boolean } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/items/use:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Utiliser un objet d'évolution (pierre ou Câble Link) sur un Pokémon de l'équipe ou de la boîte
      description: |
        Les objets se trouvent sur les Pokémon sauvages vaincus (10 % de chance, objet lié à leur type) et sont remis par les arènes.
        Le Câble Link fait évoluer les Pokémon qui évoluent par échange (Kadabra, Machopeur, Gravalanch, Spectrum…).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { item: { type: string, enum: [fire-stone, water-stone, thunder-stone, leaf-stone, moon-stone, link-cable] }, uid: { type: string, example: p2 } } }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/battle/next:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Fermer le combat terminé et enchaîner sur le Pokémon sauvage suivant, au même endroit
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /game/settings:
    put:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Réglages du joueur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nextEncounterButton: { type: boolean, description: "Proposer « Pokémon suivant » en fin de combat sur une route", default: true }
                recruitOnlyNew: { type: boolean, description: Ne proposer de rejoindre l'équipe qu'aux espèces pas encore obtenues, default: false }
                autoReplaceMoves: { type: boolean, description: "Avec 4 attaques équipées, une nouvelle attaque remplace la plus ancienne (sinon elle rejoint les attaques connues)", default: true }
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }

  /game/battle/close:
    post:
      tags: [Aventure]
      security: [{ bearerAuth: [] }]
      summary: Fermer un combat terminé
      responses:
        "200":
          description: État de la partie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameView" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /regions/{name}/locations:
    get:
      tags: [Régions]
      summary: Lieux d'une région (villes, routes, grottes…)
      description: |
        Rangés par catégorie (villes, routes par numéro, grottes/forêts/mers, autres lieux), avec leur nom français.
        Récupérés sur PokéAPI à la première consultation puis mis en cache.
      parameters:
        - name: name
          in: path
          required: true
          schema: { $ref: "#/components/schemas/RegionName" }
      responses:
        "200":
          description: Lieux de la région
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegionLocations" }
        "404": { $ref: "#/components/responses/NotFound" }

  /locations/{name}:
    get:
      tags: [Régions]
      summary: Pokémon rencontrés dans un lieu, zone par zone et jeu par jeu
      description: |
        Pour chaque jeu : méthode de rencontre (en français), niveaux et chance cumulée par méthode.
        PokéAPI n'a pas de données de rencontre pour certains lieux (notamment à Paldea).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          example: kanto-route-1
      responses:
        "200":
          description: Rencontres du lieu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /regions:
    get:
      tags: [Pokémon]
      summary: Les 9 régions et le nombre de Pokémon en base pour chacune
      responses:
        "200":
          description: Régions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegionCount" }

  /types:
    get:
      tags: [Pokémon]
      summary: Types présents en base et nombre de Pokémon par type
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TypeCount" }

  /pokemon/{idOrName}:
    get:
      tags: [Pokémon]
      summary: Détail d'un Pokémon
      description: Lu en base, ou récupéré sur pokeapi.co puis enregistré s'il est absent.
      parameters:
        - name: idOrName
          in: path
          required: true
          description: Id PokéAPI ou nom (insensible à la casse)
          schema: { type: string }
          example: pikachu
        - name: refresh
          in: query
          description: Force la récupération depuis pokeapi.co
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Le Pokémon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pokemon" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /pokemon/{idOrName}/evolutions:
    get:
      tags: [Pokémon]
      summary: Arbre d'évolution et conditions d'évolution (en français)
      description: |
        Renvoie toute la famille du Pokémon, forme par forme : formes régionales comprises, chacune avec sa
        propre lignée si elle évolue autrement (Raichu d'Alola, Miaouss de Galar → Berserkatt…). Les membres absents de la base
        sont récupérés automatiquement. Chaque nœud indique comment son prédécesseur évolue en lui
        (« Niveau 16 », « Utiliser Pierre Foudre », « Échange, en tenant Roche Royale »…).
      parameters:
        - name: idOrName
          in: path
          required: true
          schema: { type: string }
          example: eevee
      responses:
        "200":
          description: La chaîne d'évolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvolutionChain" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /pokemon/{idOrName}/moves:
    get:
      tags: [Pokémon]
      summary: Attaques apprises dans le jeu le plus récent
      description: |
        Attaques du jeu principal le plus récent où le Pokémon apparaît (Écarlate / Violet pour la plupart).
        Triées par méthode (par niveau, CT/CS, œufs, tuteur…) puis par niveau. Le détail des attaques
        (nom français, type, catégorie, puissance, précision, PP, description) est mis en cache en base.
      parameters:
        - name: idOrName
          in: path
          required: true
          schema: { type: string }
          example: pikachu
      responses:
        "200":
          description: Attaques apprises
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokemonMoves" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /pokemon/{idOrName}/type-defenses:
    get:
      tags: [Pokémon]
      summary: Faiblesses, résistances et immunités de type
      description: |
        Multiplicateur de dégâts de chacun des 18 types attaquants contre ce Pokémon (produit des
        facteurs de ses types). Les talents qui modifient ces relations (Lévitation, Absorb Eau…)
        sont signalés dans abilityNotes mais pas appliqués aux multiplicateurs.
      parameters:
        - name: idOrName
          in: path
          required: true
          schema: { type: string }
          example: gyarados
      responses:
        "200":
          description: Relations de type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypeDefenses" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /pokemon/import:
    post:
      tags: [Pokémon]
      summary: Import en masse depuis pokeapi.co
      description: Les Pokémon déjà en base sont ignorés.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 151 }
          description: Nombre d'espèces ; leurs formes régionales sont importées en plus
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Résultat de l'import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /teams:
    get:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Liste des équipes
      responses:
        "200":
          description: Les équipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
    post:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Crée une équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Équipe créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Détail d'une équipe
      responses:
        "200":
          description: L'équipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Renomme une équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameTeamRequest" }
      responses:
        "200":
          description: Équipe renommée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Supprime une équipe
      responses:
        "204": { description: Équipe supprimée }
        "404": { $ref: "#/components/responses/NotFound" }

  /teams/{teamId}/pokemon/{idOrName}:
    post:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Ajoute un Pokémon à l'équipe
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: idOrName
          in: path
          required: true
          schema: { type: string }
          example: pikachu
      responses:
        "201":
          description: Équipe mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          description: Pokémon inconnu ou équipe complète
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teams/{teamId}/members/{position}:
    delete:
      tags: [Équipes]
      security: [{ bearerAuth: [] }]
      summary: Retire le Pokémon à une position
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 6 }
      responses:
        "200":
          description: Équipe mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton renvoyé par /auth/login ou /auth/register
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
      example: 1

  responses:
    Unauthorized:
      description: Connexion requise (jeton absent, invalide ou expiré), ou identifiants incorrects
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: PokéAPI indisponible
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: sacha }
        password: { type: string, format: password, example: pikachu123 }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: sacha }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        token: { type: string, description: "Jeton de session, à envoyer en « Authorization: Bearer … »" }
        user: { $ref: "#/components/schemas/User" }
    Pokemon:
      type: object
      properties:
        id: { type: integer, description: "Id PokéAPI (≥ 10001 pour une forme régionale)", example: 25 }
        speciesId: { type: integer, description: Numéro du Pokédex national, example: 25 }
        regionalForm: { type: string, nullable: true, enum: [alola, galar, hisui, paldea], description: Région de la forme régionale }
        name: { type: string, example: pikachu }
        nameFr: { type: string, nullable: true, example: Pikachu }
        generation: { type: integer, nullable: true, example: 1 }
        region: { type: string, nullable: true, example: kanto }
        statTotal: { type: integer, example: 320 }
        height: { type: integer, description: En décimètres, example: 4 }
        weight: { type: integer, description: En hectogrammes, example: 60 }
        baseExperience: { type: integer, nullable: true, example: 112 }
        spriteUrl: { type: string, nullable: true }
        artworkUrl: { type: string, nullable: true }
        types:
          type: array
          items: { type: string }
          example: [electric]
        stats:
          type: object
          additionalProperties: { type: integer }
          example: { hp: 35, attack: 55, defense: 40, special-attack: 50, special-defense: 50, speed: 90 }
        abilities:
          type: array
          items: { $ref: "#/components/schemas/Ability" }
    Ability:
      type: object
      properties:
        name: { type: string, example: static }
        hidden: { type: boolean, example: false }
        nameFr: { type: string, nullable: true, example: Statik }
        description: { type: string, nullable: true, description: Texte du jeu le plus récent (français) }
        effect: { type: string, nullable: true, description: Effet détaillé (paragraphes séparés par une ligne vide) }
        effectLanguage: { type: string, nullable: true, enum: [fr, en], description: "Langue de l'effet (anglais si pas de traduction)" }
        generation: { type: integer, nullable: true, example: 3 }
    AbilityDetail:
      type: object
      properties:
        name: { type: string, example: static }
        nameFr: { type: string, nullable: true, example: Statik }
        description: { type: string, nullable: true }
        effect: { type: string, nullable: true }
        effectLanguage: { type: string, nullable: true, enum: [fr, en] }
        generation: { type: integer, nullable: true, example: 3 }
        pokemon:
          type: array
          description: Pokémon ayant ce talent (formes alternatives exclues), triés par numéro
          items:
            type: object
            properties:
              id: { type: integer, example: 25 }
              name: { type: string, example: pikachu }
              nameFr: { type: string, nullable: true, description: Renseigné si le Pokémon est en base, example: Pikachu }
              hidden: { type: boolean, example: false }
              spriteUrl: { type: string, nullable: true }
    PokemonSummary:
      type: object
      properties:
        id: { type: integer, description: "Id PokéAPI (≥ 10001 pour une forme régionale)", example: 25 }
        speciesId: { type: integer, description: Numéro du Pokédex national, example: 25 }
        regionalForm: { type: string, nullable: true, enum: [alola, galar, hisui, paldea], description: Région de la forme régionale }
        name: { type: string, example: pikachu }
        nameFr: { type: string, nullable: true, example: Pikachu }
        generation: { type: integer, nullable: true, example: 1 }
        region: { type: string, nullable: true, example: kanto }
        types:
          type: array
          items: { type: string }
          example: [electric]
        statTotal: { type: integer, example: 320 }
        spriteUrl: { type: string, nullable: true }
        artworkUrl: { type: string, nullable: true }
    EvolutionChain:
      type: object
      properties:
        id: { type: integer, nullable: true, description: Id de la chaîne PokéAPI, example: 22 }
        roots:
          type: array
          description: |
            Lignées de la famille, forme par forme : la forme de base d'abord, puis les formes régionales
            (Miaouss → Persian, Miaouss d'Alola → Persian d'Alola, Miaouss de Galar → Berserkatt).
          items: { $ref: "#/components/schemas/EvolutionNode" }
    EvolutionNode:
      type: object
      properties:
        speciesId: { type: integer, description: Numéro du Pokédex national, example: 53 }
        name: { type: string, description: "Nom PokéAPI de la forme (« persian-alola ») ou de l'espèce", example: persian-alola }
        pokemon:
          allOf: [{ $ref: "#/components/schemas/PokemonSummary" }]
          nullable: true
        isBaby: { type: boolean, example: false }
        conditions:
          type: array
          description: Comment le Pokémon précédent évolue en celui-ci (vide pour la forme de base). Plusieurs entrées = plusieurs méthodes.
          items: { type: string }
          example: [Utiliser Pierre Eau]
        evolvesTo:
          type: array
          items: { $ref: "#/components/schemas/EvolutionNode" }
    VersionGroup:
      type: object
      properties:
        name: { type: string, example: scarlet-violet }
        label: { type: string, example: Écarlate / Violet }
    LearnedMove:
      type: object
      properties:
        name: { type: string, example: thunderbolt }
        nameFr: { type: string, nullable: true, example: Tonnerre }
        type: { type: string, nullable: true, example: electric }
        damageClass: { type: string, nullable: true, enum: [physical, special, status], example: special }
        power: { type: integer, nullable: true, example: 90 }
        accuracy: { type: integer, nullable: true, example: 100 }
        pp: { type: integer, nullable: true, example: 15 }
        priority: { type: integer, example: 0 }
        description: { type: string, nullable: true }
        method: { type: string, example: machine, description: "level-up, machine, egg, tutor…" }
        methodLabel: { type: string, example: CT / CS }
        level: { type: integer, nullable: true, description: "Niveau (méthode level-up) ; 0 = à l'évolution", example: 26 }
        ailment: { type: string, nullable: true, description: "Statut infligé (paralysis, burn, poison, sleep, freeze…)", example: paralysis }
        ailmentChance: { type: integer, description: "Chance d'infliger le statut (%), 0 = toujours pour une attaque de statut", example: 10 }
    PokemonMoves:
      type: object
      properties:
        pokemonId: { type: integer, example: 25 }
        versionGroup:
          allOf: [{ $ref: "#/components/schemas/VersionGroup" }]
          nullable: true
          description: Jeu dont proviennent les attaques (null si aucune)
        moves:
          type: array
          items: { $ref: "#/components/schemas/LearnedMove" }
    TypeMultiplier:
      type: object
      properties:
        type: { type: string, description: Type attaquant, example: electric }
        multiplier: { type: number, enum: [0, 0.25, 0.5, 1, 2, 4], example: 4 }
    TypeDefenses:
      type: object
      properties:
        pokemonId: { type: integer, example: 130 }
        types:
          type: array
          items: { type: string }
          example: [water, flying]
        multipliers:
          type: array
          description: Les 18 types attaquants, dans l'ordre officiel
          items: { $ref: "#/components/schemas/TypeMultiplier" }
        weaknesses:
          type: array
          description: Multiplicateur > 1, du plus fort au plus faible
          items: { $ref: "#/components/schemas/TypeMultiplier" }
        resistances:
          type: array
          description: 0 < multiplicateur < 1, de la plus forte résistance à la plus faible
          items: { $ref: "#/components/schemas/TypeMultiplier" }
        immunities:
          type: array
          items: { type: string }
          example: [ground]
        abilityNotes:
          type: array
          items:
            type: object
            properties:
              ability: { type: string, example: levitate }
              abilityFr: { type: string, nullable: true, example: Lévitation }
              note: { type: string, example: immunisé contre le type Sol }
    PokedexUpdateStatus:
      type: object
      properties:
        state: { type: string, enum: [idle, running, completed, cancelled, failed], example: running }
        mode: { type: string, nullable: true, enum: [missing, all], example: missing }
        total: { type: integer, description: Espèces du Pokédex national à traiter, example: 1025 }
        processed: { type: integer, description: Espèces traitées, example: 340 }
        imported: { type: integer, example: 182 }
        alreadyUpToDate: { type: integer, example: 158 }
        regionalForms: { type: integer, description: Formes régionales importées en plus, example: 19 }
        failed:
          type: array
          description: Noms en échec (50 au plus)
          items: { type: string }
        failedCount: { type: integer, example: 0 }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        error: { type: string, nullable: true }
    GameView:
      type: object
      description: État de la partie (voir les modèles du dépôt pour le détail des champs)
      properties:
        started: { type: boolean }
        currentStep: { type: integer }
        unlockedStep: { type: integer, description: Étape la plus lointaine accessible }
        badges: { type: integer }
        levelCap: { type: integer, description: Niveau maximum selon les badges }
        caught: { type: integer, description: Espèces de Kanto obtenues }
        dexSize: { type: integer, example: 151 }
        steps: { type: array, items: { type: object } }
        team: { type: array, items: { type: object } }
        box: { type: array, items: { type: object } }
        battle: { type: object, nullable: true }
    RegionLocations:
      type: object
      properties:
        name: { $ref: "#/components/schemas/RegionName" }
        nameFr: { type: string, nullable: true, example: Kanto }
        locations:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: kanto-route-1 }
              nameFr: { type: string, nullable: true, example: Route 1 }
              category: { type: string, enum: [city, route, nature, other] }
              routeNumber: { type: integer, nullable: true, example: 1 }
              hasEncounters: { type: boolean, description: "false si PokéAPI n'a aucune rencontre pour ce lieu" }
              detail: { type: string, nullable: true, description: Précision quand plusieurs lieux ont le même nom, example: Marina }
    LocationDetail:
      type: object
      properties:
        name: { type: string, example: kanto-route-1 }
        nameFr: { type: string, nullable: true, example: Route 1 }
        region: { type: string, example: kanto }
        versions:
          type: array
          description: Jeux qui ont des rencontres ici, du plus récent au plus ancien
          items:
            type: object
            properties:
              name: { type: string, example: red }
              label: { type: string, example: Rouge }
        areas:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: kanto-route-1-area }
              label: { type: string, nullable: true, description: Nom de la zone (null pour la zone principale) }
              encounters:
                type: array
                items:
                  type: object
                  properties:
                    version: { type: string, example: red }
                    pokemonId: { type: integer, example: 16 }
                    name: { type: string, example: pidgey }
                    nameFr: { type: string, nullable: true, example: Roucool }
                    speciesId: { type: integer, nullable: true, example: 16 }
                    spriteUrl: { type: string, nullable: true }
                    types: { type: array, items: { type: string } }
                    methods:
                      type: array
                      items:
                        type: object
                        properties:
                          method: { type: string, example: walk }
                          label: { type: string, example: En marchant dans les herbes hautes ou une grotte }
                          minLevel: { type: integer, example: 2 }
                          maxLevel: { type: integer, example: 4 }
                          chance: { type: integer, description: Chance cumulée (%), example: 50 }
    RegionName:
      type: string
      enum: [kanto, johto, hoenn, sinnoh, unova, kalos, alola, galar, hisui, paldea]
    RegionCount:
      type: object
      properties:
        name: { $ref: "#/components/schemas/RegionName" }
        generation: { type: integer, example: 1 }
        count: { type: integer, example: 151 }
    TypeCount:
      type: object
      properties:
        name: { type: string, example: fire }
        count: { type: integer, example: 64 }
    PokemonPage:
      type: object
      properties:
        total: { type: integer, example: 151 }
        limit: { type: integer, example: 20 }
        offset: { type: integer, example: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/PokemonSummary" }
    ImportResult:
      type: object
      properties:
        requested: { type: integer, example: 151 }
        imported: { type: integer, example: 148 }
        alreadyCached: { type: integer, example: 3 }
        regionalForms: { type: integer, description: "Formes régionales importées en plus (Raichu d'Alola…)", example: 36 }
        failed:
          type: array
          items: { type: string }
          example: []
    Team:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Starters }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: "#/components/schemas/PokemonSummary" }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Starters }
        pokemon:
          type: array
          maxItems: 6
          description: Ids ou noms de Pokémon
          items: { type: string }
          example: [bulbasaur, charmander, squirtle]
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Kanto }
    Health:
      type: object
      properties:
        status: { type: string, example: UP }
        database: { type: string, example: UP }
    Error:
      type: object
      properties:
        error: { type: string }
