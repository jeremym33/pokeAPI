openapi: 3.0.3
info:
  title: PokéAPI Ktor
  version: 0.1.0
  description: |
    API Ktor qui s'appuie sur [PokéAPI](https://pokeapi.co/) et met les données en cache dans PostgreSQL.

    Pour commencer : lancez **POST /pokemon/import** (par exemple `limit=151`), puis parcourez **GET /pokemon**.
servers:
  - url: /
tags:
  - name: Pokémon
    description: Consultation et import des Pokémon
  - name: Équipes
    description: Équipes de 6 Pokémon maximum
  - name: Divers

paths:
  /health:
    get:
      tags: [Divers]
      summary: État de l'application et de la base
      responses:
        "200":
          description: Application et base opérationnelles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Base de données indisponible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /pokemon:
    get:
      tags: [Pokémon]
      summary: Pokédex — liste paginée, filtrable et triable
      description: Ne renvoie que les Pokémon déjà enregistrés (importés ou consultés).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: type
          in: query
          description: Filtre par type (fire, water, grass…). Deux types séparés par une virgule = le Pokémon doit avoir les deux.
          schema: { type: string }
          example: fire
        - name: region
          in: query
          description: Région d'origine de l'espèce
          schema: { $ref: "#/components/schemas/RegionName" }
        - name: generation
          in: query
          schema: { type: integer, minimum: 1, maximum: 9 }
        - name: name
          in: query
          description: Recherche partielle sur le nom anglais ou français
          schema: { type: string }
          example: sala
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, name, nameFr, height, weight, baseExperience, statTotal]
            default: id
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Page de résultats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PokemonPage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /regions:
    get:
      tags: [Pokémon]
      summary: Les 9 régions et le nombre de Pokémon en base pour chacune
      responses:
        "200":
          description: Régions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RegionCount" }

  /types:
    get:
      tags: [Pokémon]
      summary: Types présents en base et nombre de Pokémon par type
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TypeCount" }

  /pokemon/{idOrName}:
    get:
      tags: [Pokémon]
      summary: Détail d'un Pokémon
      description: Lu en base, ou récupéré sur pokeapi.co puis enregistré s'il est absent.
      parameters:
        - name: idOrName
          in: path
          required: true
          description: Id PokéAPI ou nom (insensible à la casse)
          schema: { type: string }
          example: pikachu
        - name: refresh
          in: query
          description: Force la récupération depuis pokeapi.co
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Le Pokémon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pokemon" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /pokemon/{idOrName}/evolutions:
    get:
      tags: [Pokémon]
      summary: Arbre d'évolution et conditions d'évolution (en français)
      description: |
        Renvoie toute la famille du Pokémon, depuis la forme de base. Les membres absents de la base
        sont récupérés automatiquement. Chaque nœud indique comment son prédécesseur évolue en lui
        (« Niveau 16 », « Utiliser Pierre Foudre », « Échange, en tenant Roche Royale »…).
      parameters:
        - name: idOrName
          in: path
          required: true
          schema: { type: string }
          example: eevee
      responses:
        "200":
          description: La chaîne d'évolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvolutionChain" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /pokemon/import:
    post:
      tags: [Pokémon]
      summary: Import en masse depuis pokeapi.co
      description: Les Pokémon déjà en base sont ignorés.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 151 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Résultat de l'import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /teams:
    get:
      tags: [Équipes]
      summary: Liste des équipes
      responses:
        "200":
          description: Les équipes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Team" }
    post:
      tags: [Équipes]
      summary: Crée une équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTeamRequest" }
      responses:
        "201":
          description: Équipe créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      tags: [Équipes]
      summary: Détail d'une équipe
      responses:
        "200":
          description: L'équipe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Équipes]
      summary: Renomme une équipe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameTeamRequest" }
      responses:
        "200":
          description: Équipe renommée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Équipes]
      summary: Supprime une équipe
      responses:
        "204": { description: Équipe supprimée }
        "404": { $ref: "#/components/responses/NotFound" }

  /teams/{teamId}/pokemon/{idOrName}:
    post:
      tags: [Équipes]
      summary: Ajoute un Pokémon à l'équipe
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: idOrName
          in: path
          required: true
          schema: { type: string }
          example: pikachu
      responses:
        "201":
          description: Équipe mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          description: Pokémon inconnu ou équipe complète
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /teams/{teamId}/members/{position}:
    delete:
      tags: [Équipes]
      summary: Retire le Pokémon à une position
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 6 }
      responses:
        "200":
          description: Équipe mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer }
      example: 1

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: PokéAPI indisponible
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Pokemon:
      type: object
      properties:
        id: { type: integer, example: 25 }
        name: { type: string, example: pikachu }
        nameFr: { type: string, nullable: true, example: Pikachu }
        generation: { type: integer, nullable: true, example: 1 }
        region: { type: string, nullable: true, example: kanto }
        statTotal: { type: integer, example: 320 }
        height: { type: integer, description: En décimètres, example: 4 }
        weight: { type: integer, description: En hectogrammes, example: 60 }
        baseExperience: { type: integer, nullable: true, example: 112 }
        spriteUrl: { type: string, nullable: true }
        artworkUrl: { type: string, nullable: true }
        types:
          type: array
          items: { type: string }
          example: [electric]
        stats:
          type: object
          additionalProperties: { type: integer }
          example: { hp: 35, attack: 55, defense: 40, special-attack: 50, special-defense: 50, speed: 90 }
        abilities:
          type: array
          items: { $ref: "#/components/schemas/Ability" }
    Ability:
      type: object
      properties:
        name: { type: string, example: static }
        hidden: { type: boolean, example: false }
    PokemonSummary:
      type: object
      properties:
        id: { type: integer, example: 25 }
        name: { type: string, example: pikachu }
        nameFr: { type: string, nullable: true, example: Pikachu }
        generation: { type: integer, nullable: true, example: 1 }
        region: { type: string, nullable: true, example: kanto }
        types:
          type: array
          items: { type: string }
          example: [electric]
        statTotal: { type: integer, example: 320 }
        spriteUrl: { type: string, nullable: true }
        artworkUrl: { type: string, nullable: true }
    EvolutionChain:
      type: object
      properties:
        id: { type: integer, nullable: true, description: Id de la chaîne PokéAPI, example: 67 }
        root: { $ref: "#/components/schemas/EvolutionNode" }
    EvolutionNode:
      type: object
      properties:
        speciesId: { type: integer, example: 134 }
        name: { type: string, example: vaporeon }
        pokemon:
          allOf: [{ $ref: "#/components/schemas/PokemonSummary" }]
          nullable: true
        isBaby: { type: boolean, example: false }
        conditions:
          type: array
          description: Comment le Pokémon précédent évolue en celui-ci (vide pour la forme de base). Plusieurs entrées = plusieurs méthodes.
          items: { type: string }
          example: [Utiliser Pierre Eau]
        evolvesTo:
          type: array
          items: { $ref: "#/components/schemas/EvolutionNode" }
    RegionName:
      type: string
      enum: [kanto, johto, hoenn, sinnoh, unova, kalos, alola, galar, paldea]
    RegionCount:
      type: object
      properties:
        name: { $ref: "#/components/schemas/RegionName" }
        generation: { type: integer, example: 1 }
        count: { type: integer, example: 151 }
    TypeCount:
      type: object
      properties:
        name: { type: string, example: fire }
        count: { type: integer, example: 64 }
    PokemonPage:
      type: object
      properties:
        total: { type: integer, example: 151 }
        limit: { type: integer, example: 20 }
        offset: { type: integer, example: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/PokemonSummary" }
    ImportResult:
      type: object
      properties:
        requested: { type: integer, example: 151 }
        imported: { type: integer, example: 148 }
        alreadyCached: { type: integer, example: 3 }
        failed:
          type: array
          items: { type: string }
          example: []
    Team:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Starters }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: "#/components/schemas/PokemonSummary" }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Starters }
        pokemon:
          type: array
          maxItems: 6
          description: Ids ou noms de Pokémon
          items: { type: string }
          example: [bulbasaur, charmander, squirtle]
    RenameTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, example: Kanto }
    Health:
      type: object
      properties:
        status: { type: string, example: UP }
        database: { type: string, example: UP }
    Error:
      type: object
      properties:
        error: { type: string }
