services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokeapi
      POSTGRES_USER: pokeapi
      POSTGRES_PASSWORD: pokeapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeapi -d pokeapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/pokeapi
      DATABASE_USER: pokeapi
      DATABASE_PASSWORD: pokeapi
    ports:
      - "8080:8080"

volumes:
  pgdata:
